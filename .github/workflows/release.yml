name: Build y release

# - Al subir un tag vX.Y.Z (lo hace release.ps1): compila para Windows, macOS
#   y Linux y publica el Release en GitHub con los instaladores.
# - "Run workflow" manual en la pestaña Actions: solo compila y deja los
#   archivos como artefactos descargables (para probar sin publicar).
#
# Seguridad:
# - Actions fijadas por SHA; dependencias de Python fijadas con hash (requirements.lock).
# - Los valores de ${{ }} van a los scripts por variables de entorno, nunca
#   pegados dentro del script (evita inyeccion de comandos con nombres de tag).
# - Firma Authenticode opcional (secretos WINDOWS_SIGN_PFX_B64 / WINDOWS_SIGN_PASSWORD).
# - Atestacion de procedencia de cada instalador: se verifica con
#     gh attestation verify GoProSync-Setup-X.exe --repo Lapo26/GoPro-Sync
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Solo lectura por defecto; el job "release" pide escritura para publicar.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # atestacion de procedencia
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verificar que el tag coincide con APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME.TrimStart("v")
          $m = Select-String -Path app/gopro_sync/version.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "El tag v$tag no coincide con APP_VERSION=$ver en app/gopro_sync/version.py. Usa release.ps1." }

      - name: Instalar Inno Setup si falta
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 -y --no-progress
          }

      - name: Compilar
        shell: pwsh
        env:
          # Opcionales: si existen los secretos, build.ps1 firma el .exe y el instalador.
          WINDOWS_SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: ./packaging/build.ps1

      - name: Autoprueba del ejecutable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist/GoProSync/GoProSync.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "La autoprueba fallo (codigo $($p.ExitCode))" }

      - name: Atestacion de procedencia
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/GoProSync-Setup-*.exe
            dist/GoProSync-*-portable.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: windows
          path: |
            dist/GoProSync-Setup-*.exe
            dist/GoProSync-*-portable.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest      # Apple Silicon (M1 y posteriores)
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Compilar (.dmg)
        run: PYTHON=python bash packaging/build_unix.sh
      - name: Atestacion de procedencia
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04      # glibc 2.35: corre en Ubuntu 22.04+, Fedora 36+, Debian 12+...
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Bibliotecas del sistema para Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 libpulse-mainloop-glib0 \
            libusb-1.0-0 file
      - name: Compilar (.AppImage)
        run: PYTHON=python bash packaging/build_unix.sh
      - name: Atestacion de procedencia
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          path: out
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" out/*/* --repo "$REPO" \
            --title "GoPro Sync $TAG_NAME" --generate-notes
